name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) {
            Write-Error 'No se generó ningún instalador .exe en dist/'
            exit 1
          }
          Write-Host "Instalador generado: $($installer.FullName)"
          Write-Host "Tamaño: $($installer.Length) bytes"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Taller-Automotriz-Windows
          path: dist/*.exe
          if-no-files-found: error

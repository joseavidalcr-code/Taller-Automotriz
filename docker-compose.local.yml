services:
  postgres:
    image: postgres:16-alpine
    container_name: taller-automotriz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taller_automotriz}
      POSTGRES_USER: ${POSTGRES_USER:-taller}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env.local}
    ports:
      - "5433:5432"
    volumes:
      - taller_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-taller} -d $${POSTGRES_DB:-taller_automotriz}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    image: node:20-alpine
    container_name: taller-automotriz-api
    restart: unless-stopped
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://taller:${POSTGRES_PASSWORD}@postgres:5432/taller_automotriz
      LOCAL_DATABASE_URL: postgresql://taller:${POSTGRES_PASSWORD}@postgres:5432/taller_automotriz
      LOCAL_SERVER_PORT: 8787
    volumes:
      - ./server:/app
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install && node migrations/run-migrations.js && node index.js"
volumes:
  taller_pgdata:
